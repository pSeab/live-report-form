<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบสร้างฟอร์มสรุปยอด Live</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4338CA; /* สีน้ำเงินม่วงทันสมัย */
            --primary-hover: #3730A3;
            --success-color: #059669; /* สีเขียว */
            --success-hover: #047857;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --border-color: #D1D5DB;
            --input-bg: #F9FAFB;
            --readonly-bg: #E5E7EB;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px; /* เว้นขอบจอมือถือเล็กน้อย */
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 600px; /* ขนาดกำลังดีบนคอมและแท็บเล็ต */
            padding: 30px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: 600;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14.5px;
            font-weight: 500;
            color: var(--text-main);
        }

        /* รวมสไตล์ช่องกรอกข้อมูลให้ขนาดเท่ากันและรองรับนิ้วจิ้ม */
        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-family: 'Prompt', sans-serif;
            font-size: 16px; /* 16px ป้องกัน iOS Zoom อัตโนมัติ */
            color: var(--text-main);
            background-color: var(--input-bg);
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(67, 56, 202, 0.15); /* เรืองแสงเวลาคลิก */
        }

        input[readonly] {
            background-color: var(--readonly-bg);
            color: var(--text-muted);
            cursor: not-allowed;
            border-color: transparent;
        }

        /* ระบบ Grid อัตโนมัติ */
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Prompt', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        button:active {
            transform: scale(0.98); /* เอฟเฟกต์ปุ่มยุบตอนกด */
        }

        .btn-submit {
            background-color: var(--primary-color);
            color: white;
            margin-top: 15px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }

        .result-section {
            display: none;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 2px dashed #E5E7EB;
            animation: fadeIn 0.4s ease;
        }

        textarea {
            width: 100%;
            height: 380px;
            padding: 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-family: 'Prompt', sans-serif;
            font-size: 15px;
            resize: none;
            box-sizing: border-box;
            background-color: #F8FAFC;
            color: var(--text-main);
            line-height: 1.5;
        }

        .btn-copy {
            background-color: var(--success-color);
            color: white;
            margin-top: 15px;
        }

        .btn-copy:hover {
            background-color: var(--success-hover);
        }

        /* ---------------------------------
           Responsive Design สำหรับมือถือ
        --------------------------------- */
        @media (max-width: 600px) {
            .two-col {
                grid-template-columns: 1fr; /* ปรับให้เรียงเป็น 1 คอลัมน์บนมือถือ */
                gap: 0;
            }
            .container {
                padding: 20px 15px;
            }
        }

        /* Animation สวยๆ ตอนแสดงผลลัพธ์ */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 สรุปยอด Live ประจำวัน</h2>
    
    <form id="reportForm">
        <div class="form-group">
            <label>🎬 วันที่</label>
            <input type="date" id="date" required>
        </div>
        <div class="form-group">
            <label>📌 สินค้า</label>
            <input type="text" id="product" placeholder="เช่น เซตบำรุงผิวหน้า" required>
        </div>
        
        <div class="two-col">
            <div class="form-group">
                <label>👩🏻 ช่อง</label>
                <select id="channel" required>
                    <option value="พี่ไขแอลแอฟโดยใจสายช้อป">พี่ไขแอลแอฟโดยใจสายช้อป</option>
                    <option value="พี่โต๊ะข้างๆแอลแอฟ">พี่โต๊ะข้างๆแอลแอฟ</option>
                </select>
            </div>
            <div class="form-group">
                <label>🥰 KOL</label>
                <select id="kol" required>
                    <option value="ของขวัญ">ของขวัญ</option>
                    <option value="ออย">ออย</option>
                    <option value="อันอัน">อันอัน</option>
                    <option value="ฟางข้าว">ฟางข้าว</option>
                    <option value="ปลา">ปลา</option>
                    <option value="ไอซ์">ไอซ์</option>
                    <option value="รัน">รัน</option>
                </select>
            </div>
        </div>

        <div class="two-col">
            <div class="form-group">
                <label>ไลฟ์สด (จำนวนชั่วโมง)</label>
                <input type="number" id="live_hours" min="1" value="1" required oninput="generateTimeOptions()">
            </div>
            <div class="form-group">
                <label>เวลา</label>
                <select id="time" required></select>
            </div>
        </div>

        <div class="two-col">
            <div class="form-group">
                <label>คนสูงสุด</label>
                <input type="number" id="max_viewers" placeholder="0" required>
            </div>
            <div class="form-group">
                <label>ต่ำสุด</label>
                <input type="number" id="min_viewers" placeholder="0" required>
            </div>
        </div>

        <div class="form-group">
            <label>ตะกร้าhot!</label>
            <input type="text" id="hot_basket" placeholder="ชื่อสินค้าที่ขายดีสุด" required>
        </div>

        <div class="two-col">
            <div class="form-group">
                <label>ขายได้ (ออเดอร์)</label>
                <input type="number" id="orders" placeholder="0" required>
            </div>
            <div class="form-group">
                <label>GMV (฿)</label>
                <input type="number" id="gmv" step="any" placeholder="0.00" required oninput="calculateCommission()">
            </div>
        </div>

        <div class="two-col">
            <div class="form-group">
                <label>Ads (฿)</label>
                <input type="number" id="ads" step="any" placeholder="0.00" required>
            </div>
            <div class="form-group">
                <label>เปอร์เซ็นต์ค่าคอม (%)</label>
                <input type="number" id="commission_percent" step="any" placeholder="เช่น 12" required oninput="calculateCommission()">
            </div>
        </div>

        <div class="form-group">
            <label>💡 ยอดค่าคอมมิชชันที่ได้ (฿)</label>
            <input type="text" id="commission_baht" readonly placeholder="ระบบคำนวณให้อัตโนมัติ">
        </div>

        <button type="button" class="btn-submit" onclick="generateReport()">🚀 สร้างสรุปข้อมูล</button>
    </form>

    <div class="result-section" id="resultSection">
        <label>✨ ผลลัพธ์ (แก้ไขข้อความก่อนคัดลอกได้)</label>
        <textarea id="outputResult" readonly></textarea>
        <button type="button" class="btn-copy" id="copyBtn" onclick="copyToClipboard()">📋 คัดลอกข้อความ</button>
    </div>
</div>

<script>
    function calculateCommission() {
        const gmv = parseFloat(document.getElementById('gmv').value) || 0;
        const percent = parseFloat(document.getElementById('commission_percent').value) || 0;
        
        if (gmv > 0 && percent > 0) {
            const result = (gmv * percent) / 100;
            document.getElementById('commission_baht').value = parseFloat(result.toFixed(2));
        } else {
            document.getElementById('commission_baht').value = '';
        }
    }

    function generateTimeOptions() {
        const hours = parseInt(document.getElementById('live_hours').value) || 1;
        const timeSelect = document.getElementById('time');
        const selectedValue = timeSelect.value;
        
        timeSelect.innerHTML = ''; 

        for (let i = 0; i < 24; i++) {
            let start = i.toString().padStart(2, '0') + ':00';
            let endHour = i + hours;
            let end = (endHour >= 24 ? endHour - 24 : endHour).toString().padStart(2, '0') + ':00';
            
            let option = document.createElement('option');
            option.value = `${start} - ${end}`;
            option.text = `${start} - ${end}`;
            timeSelect.appendChild(option);
        }
        
        if (selectedValue) {
            timeSelect.value = selectedValue;
        }
    }

    window.onload = function() {
        generateTimeOptions();
        document.getElementById('date').valueAsDate = new Date();
    };

    function formatDateThai(dateString) {
        if (!dateString) return '';
        const date = new Date(dateString);
        const days = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
        const months = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
        
        const dayName = days[date.getDay()];
        const dayNum = date.getDate();
        const monthName = months[date.getMonth()];
        const year = date.getFullYear() + 543;
        
        return `${dayName} ที่ ${dayNum} ${monthName} ${year}`;
    }

    function generateReport() {
        const dateThai = formatDateThai(document.getElementById('date').value);
        const product = document.getElementById('product').value;
        const channel = document.getElementById('channel').value;
        const kol = document.getElementById('kol').value;
        const live_hours = document.getElementById('live_hours').value || 0;
        const time = document.getElementById('time').value;
        const max_viewers = document.getElementById('max_viewers').value;
        const min_viewers = document.getElementById('min_viewers').value;
        const hot_basket = document.getElementById('hot_basket').value;
        const orders = document.getElementById('orders').value;
        const gmv = document.getElementById('gmv').value || 0;
        const ads = document.getElementById('ads').value || 0;
        const commission_percent = document.getElementById('commission_percent').value || 0;
        const commission_baht = document.getElementById('commission_baht').value || 0;

        const template = `🎬 ${dateThai}
📌 สินค้า - ${product}
👩🏻 ช่อง - ${channel}
🥰 KOL - ${kol}

ไลฟ์สด        : ${live_hours} ชั่วโมง
เวลา            : ${time}
คนสูงสุด      : ${max_viewers}
ต่ำสุด          : ${min_viewers}
ตะกร้าhot!  : ${hot_basket}
ขายได้        : ${orders} ออเดอร์
GMV          : ${gmv} ฿
Ads            : ${ads} ฿
ค่าคอม       : ${commission_baht} ฿

💸 ยอดขายรวมรอบ KOL ${kol} ${live_hours} Hrs. : ${gmv} ฿ | Com ${commission_percent} % : ${commission_baht} ฿`;

        document.getElementById('outputResult').value = template;
        const resultSection = document.getElementById('resultSection');
        resultSection.style.display = 'block';
        
        // เลื่อนหน้าจอลงมาที่ผลลัพธ์อัตโนมัติ (นุ่มนวล)
        resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        
        const copyBtn = document.getElementById('copyBtn');
        copyBtn.innerHTML = '📋 คัดลอกข้อความ';
        copyBtn.style.backgroundColor = 'var(--success-color)';
    }

    function copyToClipboard() {
        const copyText = document.getElementById("outputResult");
        copyText.removeAttribute('readonly');
        copyText.select();
        copyText.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(copyText.value).then(() => {
            const copyBtn = document.getElementById('copyBtn');
            copyBtn.innerHTML = '✅ คัดลอกสำเร็จแล้ว!';
            copyBtn.style.backgroundColor = 'var(--success-hover)';
        });
        copyText.setAttribute('readonly', true);
    }
</script>

</body>
</html>
